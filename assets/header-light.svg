tspan fill-opacity="0">n<animate attributeName="fill-opacity" values="0;1" keyTimes="0;0.228" calcMode="discrete" dur="10s" repeatCount="indefinite"/></tspan><tspan fill-opacity="0">e<animate attributeName="fill-opacity" values="0;1" keyTimes="0;0.2325" calcMode="discrete" dur="10s" repeatCount="indefinite"/></tspan><tspan fill-opacity="0">e<animate attributeName="fill-opacity" values="0;1" keyTimes="0;0.237" calcMode="discrete" dur="10s" repeatCount="indefinite"/></tspan><tspan fill-opacity="0">r<animate attributeName="fill-opacity" values="0;1" keyTimes="0;0.2415" calcMode="discrete" dur="10s" repeatCount="indefinite"/></tspan><tspan fill-opacity="0"> <animate attributeName="fill-opacity" values="0;1" keyTimes="0;0.246" calcMode="discrete" dur="10s" repeatCount="indefinite"/></tspan><tspan fill-opacity="0">i<animate attributeName="fill-opacity" values="0;1" keyTimes="0;0.2505" calcMode="discrete" dur="10s" repeatCount="indefinite"/></tspan><tspan fill-opacity="0">n<animate attributeName="fill-opacity" values="0;1" keyTimes="0;0.255" calcMode="discrete" dur="10s" repeatCount="indefinite"/></tspan><tspan fill-opacity="0"> <animate attributeName="fill-opacity" values="0;1" keyTimes="0;0.2595" calcMode="discrete" dur="10s" repeatCount="indefinite"/></tspan><tspan fill-opacity="0">s<animate attributeName="fill-opacity" values="0;1" keyTimes="0;0.264" calcMode="discrete" dur="10s" repeatCount="indefinite"/></tspan><tspan fill-opacity="0">e<animate attributeName="fill-opacity" values="0;1" keyTimes="0;0.2685" calcMode="discrete" dur="10s" repeatCount="indefinite"/></tspan><tspan fill-opacity="0">o<animate attributeName="fill-opacity" values="0;1" keyTimes="0;0.273" calcMode="discrete" dur="10s" repeatCount="indefinite"/></tspan><tspan fill-opacity="0">u<animate attributeName="fill-opacity" values="0;1" keyTimes="0;0.2775" calcMode="discrete" dur="10s" repeatCount="indefinite"/></tspan><tspan fill-opacity="0">l<animate attributeName="fill-opacity" values="0;1" keyTimes="0;0.282" calcMode="discrete" dur="10s" repeatCount="indefinite"/></tspan><tspan fill="#BC52EE" fill-opacity="0">_<animate attributeName="fill-opacity" values="0;1" keyTimes="0;0.285" calcMode="discrete" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" calcMode="discrete" repeatCount="indefinite"/></tspan></text>

    <g>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.31;0.38;0.90;0.95;1"
        dur="10s" repeatCount="indefinite"/>
      <text font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" x="440" y="186" text-anchor="middle" font-size="13.5" fill="#6E7781">i like making slow things fast and big things small.</text>
    </g>
  </g>

  <rect x="140" y="212" width="600" height="2" fill="url(#rule)"/>
</svg>
