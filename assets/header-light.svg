<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="880" height="240" role="img" aria-label="ray - frontend and devtools engineer in seoul">
  <defs>
    <radialGradient id="blobA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#BC52EE" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#BC52EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7FB2E5" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#7FB2E5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#BC52EE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#BC52EE" stop-opacity="1"/>
      <stop offset="100%" stop-color="#7FB2E5" stop-opacity="0"/>
      <animate attributeName="x1" values="-1;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <!-- static clip: keeps the drifting blobs inside the card's rounded corners -->
    <clipPath id="card">
      <rect width="880" height="240" rx="14"/>
    </clipPath>
  </defs>

  <rect width="880" height="240" rx="14" fill="#FFFFFF"/>

  <!-- slow drifting colour blobs -->
  <g opacity="0.75" clip-path="url(#card)">
    <circle r="85" fill="url(#blobA)" cx="150" cy="60">
      <animateTransform attributeName="transform" type="translate"
        values="0,0; 90,30; 30,-15; 0,0" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle r="95" fill="url(#blobB)" cx="740" cy="185">
      <animateTransform attributeName="transform" type="translate"
        values="0,0; -80,-35; -20,20; 0,0" dur="17s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- text: types in, holds, fades out before the loop restarts -->
  <g>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.90;0.95;1"
      dur="10s" repeatCount="indefinite"/>

    <text xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" x="440" y="100" text-anchor="middle" font-size="46" font-weight="700" fill="#0B0B0B"><tspan fill-opacity="0">r<animate attributeName="fill-opacity" values="0;1" keyTimes="0;0.03" calcMode="discrete" dur="10s" repeatCount="indefinite"/></tspan><tspan fill-opacity="0">a<animate attributeName="fill-opacity" values="0;1" keyTimes="0;0.046" calcMode="discrete" dur="10s" repeatCount="indefinite"/></tspan><tspan fill-opacity="0">y<animate attributeName="fill-opacity" values="0;1" keyTimes="0;0.062" calcMode="discrete" dur="10s" repeatCount="indefinite"/></tspan></text>

